<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAIFIT — Scan CN</title>
<style>
  body { margin:0; background:#0d0d0f; color:#f2f2f2;
         font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:14px; }
  .t { color:#d4a017; letter-spacing:2px; font-weight:800; text-align:center; }
  h1 { text-align:center; font-size:20px; margin:6px 0 12px; }
  video { width:100%; border-radius:14px; background:#000; min-height:200px; }
  .status { text-align:center; color:#9a9aa2; margin:10px 0; min-height:20px; font-size:14px; }
  .modes { display:flex; gap:8px; margin:10px 0; }
  .bigmode { flex:1; padding:14px 6px; font-size:16px; background:#232329; color:#9a9aa2;
             border:2px solid #2c2c33; border-radius:12px; font-weight:800; cursor:pointer; }
  .bigmode.onD { background:#2b6cb0; color:#fff; border-color:#2b6cb0; }
  .bigmode.onR { background:#8a5a00; color:#fff; border-color:#8a5a00; }
  .row { display:flex; gap:8px; margin:10px 0; }
  input { flex:1; background:#17171b; border:1px solid #2c2c33; color:#fff; border-radius:10px;
          padding:13px; font-size:16px; text-transform:uppercase; }
  button { border:0; border-radius:10px; font-weight:800; cursor:pointer; }
  .add { background:#2b6cb0; color:#fff; padding:0 18px; font-size:15px; }
  .item { display:flex; align-items:center; gap:8px; background:#17171b; border:1px solid #2c2c33;
          border-radius:12px; padding:10px 12px; margin:8px 0; }
  .cn { flex:1; font-weight:800; letter-spacing:.5px; word-break:break-all; }
  .mode { padding:9px 10px; font-size:13px; background:#232329; color:#9a9aa2; }
  .mode.onD { background:#2b6cb0; color:#fff; }
  .mode.onR { background:#8a5a00; color:#fff; }
  .st { font-size:15px; min-width:22px; text-align:center; }
  .del { background:#3a2323; color:#ff9c9c; padding:9px 12px; }
  .note { text-align:center; color:#777; font-size:12px; margin-top:12px; }
  .clear { display:block; margin:10px auto 0; background:none; color:#9a9aa2; font-size:13px;
           text-decoration:underline; padding:6px; }
  a.back { display:block; text-align:center; margin-top:14px; color:#d4a017; text-decoration:none; }
  .sndbtn { display:block; margin:0 auto 10px; background:#232329; color:#f2f2f2; padding:9px 16px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="t">FAIFIT</div>
  <h1>📷 Scan CN — Auto Save</h1>
  <button class="sndbtn" id="btnSound">🔊 Sound: On</button>
  <div class="modes">
    <button class="bigmode onD" id="modeD">🚚 Dispatch</button>
    <button class="bigmode" id="modeR">↩️ Return</button>
  </div>
  <video id="vid" autoplay playsinline muted></video>
  <div class="status" id="status">Camera opening…</div>
  <div class="row">
    <input id="manual" placeholder="Type CN — VR…" autocomplete="off">
    <button class="add" id="btnAdd">Add</button>
  </div>
  <div id="list"></div>
  <button class="clear" id="btnClear" style="display:none">Clear saved list</button>
  <div class="note">Just keep scanning — every CN saves to the sheet by itself. One scan per parcel; a parcel already saved will not scan again.</div>
  <a class="back" href="https://script.google.com/macros/s/AKfycbzuTY5mdf_RvYQUgNKUQ2m4vj03Jt_KX8R2Cy_s36aHFvPhEbnw4pKvk19BBkUzb0w4pg/exec">← Back to App</a>
</div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbzuTY5mdf_RvYQUgNKUQ2m4vj03Jt_KX8R2Cy_s36aHFvPhEbnw4pKvk19BBkUzb0w4pg/exec';
  var items = [];
  var CURMODE = 'D';
  var statusEl = document.getElementById('status');
  var SOUND = true;
  try { SOUND = localStorage.getItem('faifit_sound') !== 'off'; } catch (e) {}
  var actx = null;
  function audio(){
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  document.addEventListener('pointerdown', function(){ if (SOUND) audio(); }, true);
  function tone(f, delay, dur, type){
    var ac = audio(); if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      var s = ac.currentTime + (delay || 0);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.25, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + (dur || 0.12));
      o.connect(g); g.connect(ac.destination);
      o.start(s); o.stop(s + (dur || 0.12) + 0.05);
    } catch (e) {}
  }
  function blip(){ if (SOUND) tone(700, 0, 0.08, 'square'); }
  function speakSaved(){
    if (!SOUND) return;
    try {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance('Saved');
        u.lang = 'en-US'; u.rate = 1.05;
        speechSynthesis.speak(u);
      }
    } catch (e) {}
  }
  function savedSound(){ if (!SOUND) return; tone(880, 0, 0.12); tone(1318, 0.1, 0.18); speakSaved(); }
  var btnSound = document.getElementById('btnSound');
  function drawSound(){ btnSound.textContent = SOUND ? '🔊 Sound: On' : '🔇 Sound: Off'; }
  btnSound.addEventListener('click', function(){
    SOUND = !SOUND;
    try { localStorage.setItem('faifit_sound', SOUND ? 'on' : 'off'); } catch (e) {}
    drawSound();
    if (SOUND) { audio(); savedSound(); }
  });
  drawSound();
  try {
    var saved = JSON.parse(localStorage.getItem('faifit_scans') || '[]');
    if (Array.isArray(saved)) items = saved.filter(function(it){
      return it && it.cn && (it.mode === 'D' || it.mode === 'R');
    }).slice(-100);
  } catch (e) { items = []; }
  function persist(){
    try { localStorage.setItem('faifit_scans', JSON.stringify(items.slice(-100))); } catch (e) {}
  }
  function clean(v){ return String(v || '').toUpperCase().replace(/[^A-Z0-9-]/g, ''); }
  function looksLikeCN(cn){
    if (cn.length < 8 || cn.length > 20) return false;
    var digits = (cn.match(/\d/g) || []).length;
    return digits >= 6;
  }
  function inList(cn){
    for (var i = 0; i < items.length; i++) if (items[i].cn === cn) return true;
    return false;
  }
  var sending = false, flushTimer = null;
  function scheduleFlush(){
    if (flushTimer) clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 1200);
  }
  function flush(){
    if (sending) { scheduleFlush(); return; }
    var batch = items.filter(function(it){ return !it.sent; });
    if (!batch.length) return;
    sending = true;
    fetch(APP, {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'include',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ items: batch.map(function(it){
        return { cn: it.cn, mode: it.mode }; }) })
    }).then(function(){
      batch.forEach(function(it){ it.sent = true; });
      sending = false;
      savedSound();
      statusEl.textContent = '✓ ' + batch[batch.length - 1].cn + ' saved to the sheet';
      render();
      if (items.some(function(it){ return !it.sent; })) scheduleFlush();
    }).catch(function(){
      sending = false;
      statusEl.textContent = '⚠ Could not save — will keep trying';
      render();
    });
  }
  setInterval(function(){
    if (!sending && items.some(function(it){ return !it.sent; })) flush();
  }, 5000);
  function addScan(raw){
    var cn = clean(raw);
    if (!cn || cn.length < 6) return;
    if (inList(cn)) { statusEl.textContent = cn + ' is already in the list'; return; }
    items.push({ cn: cn, mode: CURMODE, sent: false });
    if (navigator.vibrate) navigator.vibrate(60);
    blip();
    statusEl.textContent = '✓ ' + cn + ' — saving…';
    render();
    scheduleFlush();
  }
  function render(){
    persist();
    var box = document.getElementById('list');
    box.innerHTML = items.map(function(it, i){
      return '<div class="item"><span class="cn">' + it.cn + '</span>' +
        '<button class="mode ' + (it.mode === 'D' ? 'onD' : 'onR') + '" data-flip="' + i + '">' +
          (it.mode === 'D' ? '🚚 Dispatch' : '↩️ Return') + '</button>' +
        '<span class="st">' + (it.sent ? '✅' : '⏳') + '</span>' +
        '<button class="del" data-del="' + i + '">✕</button></div>';
    }).join('');
    box.querySelectorAll('[data-flip]').forEach(function(b){
      b.addEventListener('click', function(){
        var it = items[+b.getAttribute('data-flip')];
        if (it.sent) return;
        it.mode = it.mode === 'D' ? 'R' : 'D';
        render(); scheduleFlush();
      });
    });
    box.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        items.splice(+b.getAttribute('data-del'), 1); render();
      });
    });
    document.getElementById('btnClear').style.display =
      items.some(function(it){ return it.sent; }) ? '' : 'none';
  }
  document.getElementById('modeD').addEventListener('click', function(){
    CURMODE = 'D';
    this.className = 'bigmode onD';
    document.getElementById('modeR').className = 'bigmode';
  });
  document.getElementById('modeR').addEventListener('click', function(){
    CURMODE = 'R';
    this.className = 'bigmode onR';
    document.getElementById('modeD').className = 'bigmode';
  });
  document.getElementById('btnClear').addEventListener('click', function(){
    items = items.filter(function(it){ return !it.sent; });
    render();
  });
  document.getElementById('btnAdd').addEventListener('click', function(){
    var inp = document.getElementById('manual');
    addScan(inp.value); inp.value = ''; inp.focus();
  });
  document.getElementById('manual').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('btnAdd').click(); }
  });
  render();
  if (items.some(function(it){ return !it.sent; })) scheduleFlush();
  (async function(){
    var vid = document.getElementById('vid');
    if (!('BarcodeDetector' in window)) {
      statusEl.textContent = 'Auto-scan is not supported in this browser — type the CN and tap Add.';
      return;
    }
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      vid.srcObject = stream;
      var det = new BarcodeDetector({ formats: ['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','qr_code','itf'] });
      statusEl.textContent = 'Show the barcode to the camera…';
      var locked = false, clearFrames = 0;
      setInterval(async function(){
        if (vid.readyState < 2) return;
        try {
          var codes = await det.detect(vid);
          var v = '';
          if (codes && codes.length) {
            for (var i = 0; i < codes.length; i++) {
              var c = clean(codes[i].rawValue);
              if (looksLikeCN(c)) { v = c; break; }
            }
          }
          if (locked) {
            if (!v) {
              clearFrames++;
              if (clearFrames >= 3) {
                locked = false; clearFrames = 0;
                statusEl.textContent = 'Ready — show the next barcode';
              }
            } else clearFrames = 0;
            return;
          }
          if (v) {
            if (inList(v)) statusEl.textContent = v + ' is already saved in the list';
            else addScan(v);
            locked = true; clearFrames = 0;
          }
        } catch (e) {}
      }, 300);
    } catch (e) {
      statusEl.textContent = 'Camera permission not given — type the CN and tap Add.';
    }
  })();
</script>
</body>
</html>
