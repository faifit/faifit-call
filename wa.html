<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAIFIT — WhatsApp</title>
<style>
  body { margin:0; background:#0d0d0f; color:#f2f2f2; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { text-align:center; padding:24px; }
  .num { font-size:22px; font-weight:800; margin:10px 0 22px; color:#fff; }
  a.wa { display:block; background:#1faa55; color:#fff; text-decoration:none; font-size:19px;
         font-weight:800; padding:16px 34px; border-radius:14px; }
  a.back { display:block; margin-top:16px; color:#d4a017; text-decoration:none; font-size:15px; }
  .t { color:#d4a017; letter-spacing:2px; font-weight:800; }
</style>
</head>
<body>
<div class="box">
  <div class="t">FAIFIT</div>
  <div class="num" id="num">…</div>
  <a class="wa" id="btn" href="#">📱 WhatsApp kholein</a>
  <a class="back" href="https://script.google.com/macros/s/AKfycbz_sgskIP3sJ_JQ8aZP0iVcjf1wjVsdeEGhZwE4_w1fa5mV3hZ66g8M-oD5cdnwbEnK4w/exec">← Wapas app par</a>
</div>
<script>
  var n = (new URLSearchParams(location.search).get('n') || '').replace(/\D/g, '');
  if (n) {
    document.getElementById('num').textContent = '+' + n;
    var app = 'whatsapp://send?phone=' + n;
    document.getElementById('btn').href = app;
    setTimeout(function(){ location.href = app; }, 350);
    setTimeout(function(){
      document.getElementById('btn').href = 'https://wa.me/' + n;
    }, 2500);
  } else {
    document.getElementById('num').textContent = 'Number nahi mila';
  }
</script>
</body>
</html>
